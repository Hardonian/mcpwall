name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo build --release
      - name: Package and checksum
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME}"
          asset="mcpwall-linux-x86_64-gnu"
          install -m 0755 target/release/mcpwall "$asset"
          python3 - "$asset" "$version" > RELEASE-MANIFEST.json <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          asset, version = sys.argv[1:]
          data = pathlib.Path(asset).read_bytes()
          print(json.dumps({
              "name": "mcpwall",
              "version": version,
              "target": "x86_64-unknown-linux-gnu",
              "asset": asset,
              "sha256": hashlib.sha256(data).hexdigest(),
          }, indent=2, sort_keys=True))
          PY
          cargo metadata --locked --format-version 1 > DEPENDENCY-METADATA.json
          sha256sum "$asset" RELEASE-MANIFEST.json DEPENDENCY-METADATA.json > SHA256SUMS
          tar -czf "mcpwall-${version}-linux-x86_64.tar.gz" "$asset" RELEASE-MANIFEST.json DEPENDENCY-METADATA.json SHA256SUMS
      - name: Attest release binary
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ github.workspace }}/mcpwall-linux-x86_64-gnu
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mcpwall-*-linux-x86_64.tar.gz
            SHA256SUMS
            RELEASE-MANIFEST.json
            DEPENDENCY-METADATA.json
