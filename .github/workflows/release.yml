name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo build --release
      - name: Package and checksum
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME}"
          asset="mcpwall-linux-x86_64-gnu"
          install -m 0755 target/release/mcpwall "$asset"
          sha256sum "$asset" > SHA256SUMS
          tar -czf "mcpwall-${version}-linux-x86_64.tar.gz" "$asset" SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mcpwall-*-linux-x86_64.tar.gz
            SHA256SUMS
