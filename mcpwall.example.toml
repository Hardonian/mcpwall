# mcpwall v1.0 policy. One server section is selected with --server.
[server.filesystem]
command = "/usr/local/bin/mcp-filesystem"
args = ["/home/scott/projects"]
allowed_tools = ["read_file", "list_directory"]
# Set true for fail-closed production configuration validation. Requires the sandbox,
# non-root identity, explicit tools, a timeout, and roots for path-bearing policies.
# production_mode = true
denied_tools = ["write_file", "delete_file"]
require_approval = ["write_file", "delete_file", "move_file"]
allowed_roots = ["/home/scott/projects"]
redact_patterns = ["token", "password", "api_key", "secret", "private_key"]
max_calls_per_minute = 60
max_request_bytes = 65536
max_argument_bytes = 32768
denied_argument_keys = ["command", "shell", "eval"]
denied_argument_values = ["/etc/shadow", "BEGIN OPENSSH PRIVATE KEY"]
approval_ttl_seconds = 300
inventory_max_age_seconds = 86400
inventory_path = "/tmp/mcpwall-filesystem.tools"
# Optional full JSON Schema files. Paths are resolved relative to this policy file.
# tool_schemas = { read_file = "schemas/read_file.json" }
audit_path = "/tmp/mcpwall-filesystem.jsonl"

# Optional Linux child sandbox. Disabled by default for backward compatibility.
# [server.filesystem.sandbox]
# enabled = true
# clear_environment = true
# environment_allowlist = ["PATH", "HOME", "LANG"]
# working_dir = "/home/scott/projects"
# timeout_seconds = 120
# max_memory_bytes = 1073741824
# max_cpu_seconds = 60
# max_file_bytes = 104857600
# max_open_files = 256
# max_processes = 64
# network_namespace = false
# mount_namespace = false
# read_only_filesystem = false
# drop_capabilities = [21, 22] # CAP_SYS_ADMIN, CAP_SYS_BOOT example
# seccomp_deny_dangerous = true
# Optional identity drop. Requires a privileged launcher for a different UID/GID.
# run_as_uid = 65534
# run_as_gid = 65534

[server.filesystem.tool_policies.read_file]
allowed_arguments = ["path"]
required_arguments = ["path"]
argument_types = { path = "string" }
path_arguments = ["path"]
